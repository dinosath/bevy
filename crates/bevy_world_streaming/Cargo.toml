[package]
name = "bevy_world_streaming"
version = "0.20.0-dev"
edition = "2024"
description = "World partition, predictive cell streaming, geometry page residency and HLOD policy for large open worlds in Bevy"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "streaming", "open-world", "lod"]

[features]
default = ["mesh"]
## Builds merged HLOD proxy [`Mesh`](bevy_mesh::Mesh)es (`hlod::MergedGeometry::into_mesh`).
mesh = ["dep:bevy_mesh", "dep:bevy_asset"]
## Enables debug visualisation with gizmos (`diagnostics::draw_streaming_gizmos`).
gizmos = ["dep:bevy_gizmos", "dep:bevy_color"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_math = { path = "../bevy_math", version = "0.20.0-dev" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }
bevy_tasks = { path = "../bevy_tasks", version = "0.20.0-dev" }
bevy_time = { path = "../bevy_time", version = "0.20.0-dev" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0-dev" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0-dev", optional = true }
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev", optional = true }
bevy_gizmos = { path = "../bevy_gizmos", version = "0.20.0-dev", optional = true }
bevy_color = { path = "../bevy_color", version = "0.20.0-dev", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "streaming"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
